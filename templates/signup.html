{%extends 'base.html'%}
{%block title%}Sign-Up Page{%endblock title%}
{%block signactive%}active{%endblock signactive%}
{%block css%}
  <style>
    .alert-error{
      background-color: rgb(249, 94, 94);
    }
    .default-form{
      border: 2px solid rgb(106, 243, 106);
      padding: 10px 24px;
      border-radius: 10px;
      width: 524px;
      margin: 10px auto;
      box-shadow: 10px 10px 20px rgb(106, 243, 106);
    }
  </style>
{%endblock css%}

{%block body%}

{%if messages%}
  {%for message in messages%}
    <div class="alert alert-{{message.tags}} alert-dismissible fade show" role="alert">
      <strong>{{message}}</strong>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
  {%endfor%}
{%endif%}
<div class="container">
<form action="/signup/" method="post" class="default-form">
    {%csrf_token%}
    <div class="mb-1">
      <label for="username" class="form-label">UserName</label>
      <input type="text" class="form-control" id="username" name="username" placeholder="Please enter your username">
    </div>
    <div class="mb-1">
      <label for="fname" class="form-label">First Name</label>
      <input type="text" class="form-control" id="fname" name="fname" placeholder="Please enter your first name">
    </div>
    <div class="mb-1">
      <label for="lname" class="form-label">Last Name</label>
      <input type="text" class="form-control" id="lname" name="lname" placeholder="Please enter your last name">
    </div>
    <div class="mb-1">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email" name="email" placeholder="Please enter your email">
    </div>
    <div class="mb-1">
      <label for="pass1" class="form-label">Password</label>
      <input type="password" class="form-control" id="pass1" name="pass1" placeholder="Please enter your password">
    </div>
    <div class="mb-1">
      <label for="pass2" class="form-label">Confirm Password</label>
      <input type="password" class="form-control" id="pass2" name="pass2" placeholder="Please confirm your password">
    </div>
    <button type="submit" class="btn btn-success">Submit</button>
</form>
</div>

{%endblock body%}
