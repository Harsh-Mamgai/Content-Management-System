{%extends 'base.html'%}
{%block title%}{%endblock title%}
{%block css%}
    <style>
        .area{
            display: block;
            width: 70%;
            margin: 18px auto;
        }
        .c{
            display: block;
            width: auto;
            margin: 18px auto;
        }
    </style>
{%endblock css%}

{%block body%}
{%if messages%}
    {%for message in messages%}
        <div class="alert alert-{{message.tags}} alert-dismissible fade show" role="alert">
            <strong>{{user.username}} {{message}}</strong>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    {%endfor%}
{%endif%}
    <div class="container">
        <h1 class="text-center">Welcome {{user.username}}</h1>
        <h5 class="text-center">You can comment here</h3>
        <form action='/comment/{{slug}}' method="post">
            {%csrf_token%}
            <div class="mb-3">
                <textarea name="comment" id="comment" placeholder="Please comment here" rows="10" cols="120" class="area"></textarea>
            </div>
            <button type="submit" class="btn btn-primary c">Submit</button>
    </form>
    </div>
{%endblock body%}
